<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Certifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #4da2a3 url('background-pattern.png') repeat; /* Using a background pattern */
            color: #fff;
        }

       /* ... (existing styles) ... */

h2 {
    color: #eaed05;
    text-align: center;
    font-weight: 700;
    font-style: italic ;
    margin-top: 100px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s ease, transform 1s ease, text-shadow 0.5s ease-in-out; /* Added text-shadow transition */
}

h2.animate {
    opacity: 1;
    transform: translateY(0);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.7); /* Glowing effect */
}

/* ... (existing styles) ... */

        


        .certification {
            margin-bottom: 20px;      
            padding: 20px;
            border: 6px solid #eb951d;
            border-radius: 10px;
            border-style:ridge;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            background-color: rgb(220, 214, 223); /* Slightly transparent white background */
            color: #000;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .certification h3 {
            margin-bottom: 10px;
        }

        .certification p {
            margin-bottom: 15px;
        }

        .image-link-button {
            display: block;
            margin-top: 10px;
            text-align: center;
        }

        .image-link-button a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #597c7e;
            color: #fff;
            text-decoration: none;
            border-radius: 20px; /* Rounded corners */
            transition: background-color 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.5); /* Glow effect */
        }

        .image-link-button a:hover {
            background-color: #005073; /* Darker color on hover */
            transform: scale(1.05); /* Slight scale-up effect */
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.8); /* Increased glow on hover */
        }

        @media only screen and (max-width: 600px) {
            .certification {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h2 class="animate">My Certifications</h2>

    <div class="certification">
        <h3>72-hour HackTriad challenge</h3>
        <p> Our project, ’The Android App Market on Google Play Store,’ not only achieved success in learning
new domains but also introduced us to the world of data analytics.</p>
        <div class="image-link-button">
            <a href="https://www.linkedin.com/posts/srimanthraj_hacktriad-innovation-teamwork-activity-7170028889719726080-tT3Z?utm_source=share&utm_medium=member_desktop" target="_blank">View Achievement Image</a>
        </div>
    </div>

</body>
</html>
