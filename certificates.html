<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Certifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #4da2a3 url('background-pattern.png') repeat; /* Using a background pattern */
            color: #fff;
        }

        h2 {
            color: #eaed05;
            text-align: center;
            font-weight: 700;
            font-style: italic;
            margin-top: 100px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease, text-shadow 0.5s ease-in-out; /* Added text-shadow transition */
        }

        h2.animate {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.7); /* Glowing effect */
        }

        .certification {
            margin-bottom: 20px;
            padding: 20px;
            border: 6px solid #eb951d;
            border-radius: 10px;
            border-style: ridge;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            background-color: rgb(220, 214, 223); /* Slightly transparent white background */
            color: #000;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .certification h3 {
            margin-bottom: 10px;
        }

        .certification p {
            margin-bottom: 15px;
        }

        .image-link-button {
            display: block;
            margin-top: 10px;
            text-align: center;
        }

        .image-link-button a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #597c7e;
            color: #fff;
            text-decoration: none;
            border-radius: 20px; /* Rounded corners */
            transition: background-color 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.5); /* Glow effect */
        }

        .image-link-button a:hover {
            background-color: #005073; /* Darker color on hover */
            transform: scale(1.05); /* Slight scale-up effect */
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.8); /* Increased glow on hover */
        }

        @media only screen and (max-width: 600px) {
            .certification {
                width: 100%;
            }
        }

        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
            color: #000;
        }

        .form-container input, .form-container textarea, .form-container button {
            display: block;
            width: calc(100% - 20px);
            margin: 10px auto;
            padding: 10px;
        }

        .form-container button {
            background-color: #597c7e;
            color: #fff;
            border: none;
            border-radius: 20px; /* Rounded corners */
            transition: background-color 0.3s ease-in-out, transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 238, 255, 0.5); /* Glow effect */
        }

        .form-container button:hover {
            background-color: #005073; /* Darker color on hover */
            transform: scale(1.05); /* Slight scale-up effect */
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.8); /* Increased glow on hover */
        }

    </style>
</head>
<body>
    <h2 class="animate">My Certifications</h2>

    <div id="certifications-list">
        <!-- Existing certifications will be inserted here -->
    </div>

    <div class="form-container">
        <h3>Add a New Certification</h3>
        <form id="add-certification-form">
            <input type="text" id="cert-title" placeholder="Certification Title" required>
            <textarea id="cert-description" placeholder="Certification Description" rows="5" required></textarea>
            <input type="file" id="cert-image" accept="image/*" required>
            <input type="url" id="cert-link" placeholder="Link to Certificate Image" required>
            <button type="submit">Add Certification</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load certifications from local storage
            const storedCerts = JSON.parse(localStorage.getItem('certifications')) || [];
            storedCerts.forEach(cert => addCertificationToPage(cert));

            document.getElementById('add-certification-form').addEventListener('submit', function(event) {
                event.preventDefault();

                const title = document.getElementById('cert-title').value;
                const description = document.getElementById('cert-description').value;
                const imageFile = document.getElementById('cert-image').files[0];
                const link = document.getElementById('cert-link').value;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const newCert = {
                        title: title,
                        description: description,
                        imageSrc: e.target.result,
                        link: link
                    };

                    // Save the new certificate to local storage
                    storedCerts.push(newCert);
                    localStorage.setItem('certifications', JSON.stringify(storedCerts));

                    // Add the new certificate to the page
                    addCertificationToPage(newCert);

                    // Clear form inputs
                    document.getElementById('cert-title').value = '';
                    document.getElementById('cert-description').value = '';
                    document.getElementById('cert-image').value = '';
                    document.getElementById('cert-link').value = '';
                };

                reader.readAsDataURL(imageFile);
            });
        });

        function addCertificationToPage(cert) {
            const newCert = document.createElement('div');
            newCert.classList.add('certification');
            newCert.innerHTML = `
                <h3>${cert.title}</h3>
                <p>${cert.description}</p>
                <div class="image-link-button">
                    <a href="${cert.link}" target="_blank">View Certificate Image</a>
                </div>
            `;

            document.getElementById('certifications-list').appendChild(newCert);
        }
    </script>
</body>
</html>
